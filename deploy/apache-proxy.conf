# cPanel / Apache: send zedsms.com to the Next.js server on 127.0.0.1:3005 (README → Deploy, option B).
#
# Install as root (replace CPANELUSER with the account that owns zedsms.com):
#   mkdir -p /etc/apache2/conf.d/userdata/ssl/2_4/CPANELUSER/zedsms.com
#   cp deploy/apache-proxy.conf /etc/apache2/conf.d/userdata/ssl/2_4/CPANELUSER/zedsms.com/zedsms-proxy.conf
#   (and the same under .../userdata/std/2_4/... for plain http, or force HTTPS in cPanel → Domains)
#   /scripts/rebuildhttpdconf && /scripts/restartsrv_httpd
# Needs mod_proxy + mod_proxy_http (WHM → EasyApache 4 → Apache Modules).

ProxyPreserveHost On
ProxyTimeout 60
# keep cPanel's AutoSSL / Let's Encrypt validation working
ProxyPass /.well-known !
ProxyPass / http://127.0.0.1:3005/
ProxyPassReverse / http://127.0.0.1:3005/
RequestHeader set X-Forwarded-Proto "https"
